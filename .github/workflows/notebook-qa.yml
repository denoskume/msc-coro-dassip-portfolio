name: Notebook QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: python -m pip install pyflakes==3.4.0

      - name: Validate notebook structure and syntax
        run: python scripts/validate_notebooks.py
